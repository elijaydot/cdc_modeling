version: 2
models:
  - name: stg_facebook_ads_ad_history
    description: Cleaned Facebook ad history with hierarchy identifiers and update timestamps.
    columns:
      - name: ad_id
        description: Facebook ad identifier
        data_tests:
          - not_null
          - unique

      - name: ad_group_id
        description: Parent Facebook ad group identifier
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_facebook_ads_ad_set_history')
                field: ad_group_id

      - name: campaign_id
        description: Parent Facebook campaign identifier
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_facebook_ads_campaign_history')
                field: campaign_id

      - name: account_id
        description: Parent Facebook account identifier
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_facebook_ads_account_history')
                field: account_id
