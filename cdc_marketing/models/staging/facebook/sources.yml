sources:
  - name: facebook_ads
    database: bronze_production
    description: Raw Facebook Ads data loaded into the Bronze layer.
    schema: cdc_staging
    config:
      enabled: true 
      meta: 
        owner: "@cde_engineer"
      freshness:
        warn_after:  
          count: 2
          period: day

    tables:
      - name: campaigns
        description: Facebook campaign history, including names and update timestamps.
        config:
          enabled: true
          event_time: campaign_updated_at

      - name: adgroups
        description: Facebook ad group history, including names and update timestamps.
        config:
          enabled: true
          event_time: ad_group_updated_at
      
      - name: ads
        description: Facebook ad history and hierarchy identifiers.
        config:
          enabled: true
          event_time: ad_updated_at
      
      - name: accounts
        description: Facebook advertising account history and account attributes.
        config:
          enabled: true
          event_time: account_updated_at
      
      - name: ads_stats
        description: Daily Facebook ad spend, impression, and click metrics.
        config:
          enabled: true
          event_time: ad_date