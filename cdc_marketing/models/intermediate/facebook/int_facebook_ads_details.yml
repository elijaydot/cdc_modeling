version: 2

models:
  - name: int_facebook_ads_details
    description: >
      Facebook ads joined with their ad group, campaign and account.
      Grain: one row per ad_id.
    columns:
      - name: ad_id
        description: Facebook ad identifier
        tests:
          - not_null
          - unique

      - name: channel_name
        description: Marketing channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Paid Social']

      - name: platform
        description: Advertising platform
        tests:
          - accepted_values:
              arguments:
                values: ['facebook']